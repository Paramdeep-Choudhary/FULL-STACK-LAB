<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechStore - Cart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <div class="logo">
            TechStore
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </nav>

    </header>


    <!-- Cart -->

    <main class="container">

        <h1 class="section-title">
            Shopping Cart
        </h1>


        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>


                <tbody>

                    <tr>
                        <td>Smartphone</td>
                        <td>1</td>
                        <td>₹29,999</td>
                        <td>₹29,999</td>
                    </tr>


                    <tr>
                        <td>Wireless Headphones</td>
                        <td>2</td>
                        <td>₹2,999</td>
                        <td>₹5,998</td>
                    </tr>


                    <tr>
                        <td>Wireless Mouse</td>
                        <td>1</td>
                        <td>₹1,499</td>
                        <td>₹1,499</td>
                    </tr>


                    <!-- Grand Total -->
                    <tr class="grand-total">

                        <td colspan="3">
                            Grand Total
                        </td>

                        <td>
                            ₹37,496
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


        <div class="checkout-button">

            <a href="checkout.html" class="btn">
                Proceed to Checkout
            </a>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <p>Contact: support@techstore.com</p>
        <p>&copy; 2026 TechStore. All Rights Reserved.</p>
    </footer>

</body>
</html>
